; Coffeeclaw - configuracion de offsets
; Extraido del proceso vivo de ARK: Survival Ascended build 94.34.0
; y verificado contra ArkAscended.exe con Ghidra 12.1.4.
;
; GWorld y GNames se resuelven por FIRMA (pattern), no por direccion fija.
; La app escanea el modulo, encuentra el patron y resuelve el desplazamiento RIP.
; Asi el .ini sobrevive a reinicios, ASLR y -si la instruccion no cambia- a
; actualizaciones del juego.
;
; Respaldo por RVA si alguna vez hiciera falta:
;   GWorldSlot=0xD428FE8   GNamesSlot=0xD472550   GNamesIndirection=0

[process]
Name=ArkAscended.exe

[roots]
; 48 8B 05 ?? ?? ?? ??    mov rax,[GWorld]
; 48 85 C0                test rax,rax
; 74 18                   jz
; 48 8B 88 A8 04 00 00    mov rcx,[rax+0x4A8]   (OwningGameInstance)
; Una sola coincidencia en el binario; resuelve a RVA 0xD428FE8.
GWorldPattern=48 8B 05 ?? ?? ?? ?? 48 85 C0 74 18 48 8B 88 A8 04 00 00
GWorldSlot=0
GWorldDispOffset=3
GWorldMatchLen=7

; 4C 8D 05 ?? ?? ?? ??    lea r8,[GNames]
; 4C 89 BC 24 C0 00 00 00 mov [rsp+0xC0],r15
; Una sola coincidencia; resuelve a RVA 0xD472550.
GNamesPattern=4C 8D 05 ?? ?? ?? ?? 4C 89 BC 24 C0 00 00 00
GNamesSlot=0
GNamesDispOffset=3
GNamesMatchLen=7
; 0 = el patron ya devuelve la direccion del pool.
GNamesIndirection=0

[offsets]
Object.ClassPrivate=0x10
Object.NamePrivate=0x18
Struct.SuperStruct=0x50
World.PersistentLevel=0x300
World.OwningGameInstance=0x4A8
GameInstance.LocalPlayers=0x38
LocalPlayer.PlayerController=0x30
PlayerController.CameraManager=0x560
PlayerController.Pawn=0x548
Character.Movement=0x550
Movement.Pos1=0x380
Movement.Pos2=0x4E8
Movement.Pos3=0x1138
CameraManager.CameraCache=0x540
Level.Actors=0xA0
Actor.RootComponent=0x120
Scene.ComponentToWorld=0x120
Transform.Translation=0x0
Scene.RelativeLocation=0x230
Camera.FOV=0x30
Mesh.Component=0x548
Mesh.ComponentToWorld=0x230
Mesh.BoxExtent=0x138
Mesh.Bones=0x9E0
Mesh.Asset=0x660
Skeleton.BoneInfo=0x380
Skeleton.RefPose=0x390
Skeleton.PoseStride=0x50
; Array animado del componente: 96 bytes por hueso
; cuaternion double +0, traslacion double +32, escala double +64
Skeleton.AnimBones=0x6D8
Skeleton.AnimStride=0x60

[filter]
DinoClassHint=PrimalDinoCharacter
MaxActors=20000
MaxDistanceM=400

[runtime]
ReaderHz=25
ActorRefreshMs=500




